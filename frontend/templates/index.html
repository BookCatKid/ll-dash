<!doctype html>
<html lang="en" class="{{ 'light' if brand.theme_mode == 'light' else '' }} {{ 'compact' if brand.density == 'compact' else '' }}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="{{ brand.theme.bg }}"/>
  <title>{{ brand.name }}</title>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
  <style>:root{--accent:{{ brand.theme.accent }};--accent2:{{ brand.theme.accent2 }};--bg:{{ brand.theme.bg }};--bg2:{{ brand.theme.bg2 }};--bg3:{{ brand.theme.bg3 }}}</style>
</head>
<body>
  <div id="svelte-root"></div>
  <script src="/static/build/app.js"></script>
</body>
</html>
