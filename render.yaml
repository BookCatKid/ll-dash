# Render preview deployment with a temporary free PostgreSQL instance.
# Free PostgreSQL expires after 30 days. Do not use this blueprint to store
# durable scouting notes without upgrading to persistent database hosting.
# https://render.com/docs/free
#
# No team-specific configuration is needed here. On first visit the app
# walks you through a setup wizard (team number, season, FTC API
# credentials, PIN, branding).
services:
  - type: web
    name: ftc-dash
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ftc-dash-db
          property: connectionString

databases:
  - name: ftc-dash-db
    plan: free
